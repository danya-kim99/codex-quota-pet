<script>
(() => {
  const root=document.getElementById('bh-companion-picker');
  const hosts=Array.from(root.querySelectorAll('.bh-product'));
  const {items:catalog,sources}=JSON.parse(document.getElementById('bh-companion-hq-data').textContent);
  const categories=[{id:'space',name:'Космос'},{id:'animals',name:'Зверюшки'},{id:'characters',name:'Персонажи'}];
  const state={selected:'character-white-shirt',preview:'character-white-shirt',category:'characters',zoom:2,open:true,width:380};
  const find=id=>catalog.find(item=>item.id===id);
  const catName=id=>categories.find(cat=>cat.id===id).name;
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button=(action,name,label,disabled=false)=>`<button type="button" class="bh-icon cursor-interaction" data-action="${action}" aria-label="${label}" data-tooltip="${label}" ${disabled?'disabled':''}>${icon(name)}</button>`;
  const sprite=item=>item?`<img class="bh-sprite" src="${item.image}" alt="" width="80" height="80">`:`<span class="bh-sprite" aria-hidden="true">${icon('circle-slash')}</span>`;
  function art(item) {
    const {source,sourceSize:[sw,sh],crop:[x,y,w,h]}=item.preview,m=Math.max(w,h);
    return `<div class="bh-art"><div class="bh-hq-crop" style="width:${w/m*100}%;height:${h/m*100}%"><img src="${sources[source]}" alt="${esc(item.name)} — крупное превью" data-hq="${item.id}" style="width:${sw/w*100}%;height:${sh/h*100}%;left:${-x/w*100}%;top:${-y/h*100}%"></div></div>`;
  }
  function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedCompanion:state.selected,companionName:find(state.selected)?.name||'Без спутника',picker:'Каталог с лупой'},privateContent:{lens:{category:state.category,zoom:state.zoom,preview:state.preview,open:state.open}}}).catch(()=>{});}
  function restore(snapshot){
    if(!snapshot)return;
    const selected=snapshot.modelContent?.selectedCompanion;
    if(selected===null||find(selected))state.selected=selected;
    const saved=snapshot.privateContent?.lens;
    if(saved){
      if(categories.some(cat=>cat.id===saved.category))state.category=saved.category;
      if([0,1,2].includes(saved.zoom))state.zoom=saved.zoom;
      if(find(saved.preview))state.preview=saved.preview;
      if(typeof saved.open==='boolean')state.open=saved.open;
    }else if(find(state.selected)){state.category=find(state.selected).category;state.preview=state.selected;}
  }
  function paintPreview(host){
    const item=find(state.preview),stage=host.querySelector('.bh-lens-stage');
    stage.querySelector('.bh-lens-image').innerHTML=art(item);
    stage.querySelector('.bh-lens-copy').dataset.selected=String(state.selected===item.id);
    stage.querySelector('.bh-lens-kind').textContent=catName(item.category);
    stage.querySelector('.bh-name').textContent=item.name;
    stage.querySelector('.bh-description').textContent=item.description||'';
    stage.querySelector('.bh-lens-status').textContent=state.selected===item.id?'✓ Выбран':'Предпросмотр';
    stage.querySelector('.bh-lens-status').dataset.selected=String(state.selected===item.id);
  }
  function render(focus,focusHost){
    const chosen=find(state.selected),items=catalog.filter(item=>item.category===state.category);
    if(!items.some(item=>item.id===state.preview))state.preview=items.find(item=>item.id===state.selected)?.id||items[0].id;
    for(const host of hosts){
    host.style.width=state.width+'px';
    host.innerHTML=`<button type="button" class="bh-entry cursor-interaction" data-action="toggle" data-selected="${Boolean(chosen)}" aria-expanded="${state.open}">${sprite(chosen)}<span class="bh-entry-label">Спутник</span><span class="bh-current-name">${chosen?esc(chosen.name):'Не выбран'}</span>${icon('chevron-down')}</button>
      <div class="bh-panel-shell"><div class="bh-panel" ${state.open?'':'hidden'}><div class="bh-head"><span>Выбрать спутника</span>${button('close','x','Закрыть выбор')}</div>
      <div class="bh-lens-stage"><div class="bh-lens-image" style="--preview-size:${[80,120,160][state.zoom]}px"></div><div class="bh-lens-copy"><div class="bh-lens-kind"></div><div class="bh-name"></div><div class="bh-description"></div><div class="bh-lens-status"></div></div></div>
      <div class="bh-toolbar"><span class="bh-toolbar-label">Превью · ${[1,1.5,2][state.zoom]}×</span><div class="bh-zoom">${button('zoom-out','zoom-out','Уменьшить превью',state.zoom===0)}<input type="range" data-zoom min="0" max="2" step="1" value="${state.zoom}" aria-label="Масштаб превью" aria-valuetext="${[1,1.5,2][state.zoom]}×">${button('zoom-in','zoom-in','Увеличить превью',state.zoom===2)}</div></div>
      <div class="bh-categories" role="group" aria-label="Категория спутника">${categories.map(cat=>`<button type="button" class="cursor-interaction" data-category="${cat.id}" aria-pressed="${state.category===cat.id}">${cat.name}</button>`).join('')}</div>
      <div class="bh-grid" aria-label="Модели спутника">${items.map(item=>`<button type="button" class="bh-tile cursor-interaction" data-model="${item.id}" aria-label="${esc(item.name)}${item.description?', '+esc(item.description):''}${state.selected===item.id?', выбран':''}" aria-pressed="${state.selected===item.id}" data-tooltip="${esc(item.name)}${item.description?' · '+esc(item.description):''}">${sprite(item)}<span class="bh-tile-name">${esc(item.name)}</span><span class="bh-check">${icon('check')}</span></button>`).join('')}</div>
      <div class="bh-footer"><button type="button" class="bh-none cursor-interaction" data-action="none" aria-pressed="${state.selected===null}">${icon(state.selected===null?'check':'circle-slash')}Без спутника</button><span class="bh-small-status">Во время работы</span></div></div></div><span class="bh-announcement" aria-live="polite"></span>`;
    paintPreview(host);
    }
    icons();if(focus)focusHost?.querySelector(focus)?.focus({preventScroll:true});
  }
  function setZoom(value){
    state.zoom=Math.max(0,Math.min(2,value));
    for(const host of hosts){
    host.querySelector('.bh-lens-image').style.setProperty('--preview-size',[80,120,160][state.zoom]+'px');
    host.querySelector('.bh-toolbar-label').textContent='Превью · '+[1,1.5,2][state.zoom]+'×';
    const range=host.querySelector('[data-zoom]');range.value=state.zoom;range.setAttribute('aria-valuetext',[1,1.5,2][state.zoom]+'×');
    host.querySelector('[data-action="zoom-out"]').disabled=state.zoom===0;host.querySelector('[data-action="zoom-in"]').disabled=state.zoom===2;
    }
  }
  function choose(id,focus,host){state.selected=id;if(id)state.preview=id;render(focus,host);host.querySelector('.bh-announcement').textContent=id?'Выбран спутник: '+find(id).name:'Спутник выключен';save();}
  for(const host of hosts){
  host.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    const {model,category,action}=target.dataset;
    if(model){choose(model,`[data-model="${model}"]`,host);return;}
    if(category){state.category=category;state.preview=catalog.find(item=>item.id===state.selected&&item.category===category)?.id||catalog.find(item=>item.category===category).id;render(`[data-category="${category}"]`,host);save();return;}
    if(action==='none'){choose(null,'[data-action="none"]',host);return;}
    if(action==='zoom-in'||action==='zoom-out'){setZoom(state.zoom+(action==='zoom-in'?1:-1));host.querySelector('[data-zoom]').focus();save();return;}
    if(action==='toggle')state.open=!state.open;
    if(action==='close')state.open=false;
    render('[data-action="toggle"]',host);save();
  });
  host.addEventListener('input',event=>{if(event.target.matches('[data-zoom]'))setZoom(Number(event.target.value));});
  host.addEventListener('change',event=>{if(event.target.matches('[data-zoom]'))save();});
  function inspect(event){const tile=event.target.closest('[data-model]');if(tile&&state.preview!==tile.dataset.model){state.preview=tile.dataset.model;hosts.forEach(paintPreview);}}
  host.addEventListener('pointermove',inspect);host.addEventListener('focusin',inspect);
  host.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.open){state.open=false;render('[data-action="toggle"]',host);save();return;}
    const tile=event.target.closest('[data-model]');if(!tile||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
    event.preventDefault();const tiles=Array.from(host.querySelectorAll('[data-model]')),index=tiles.indexOf(tile),columns=getComputedStyle(host.querySelector('.bh-grid')).gridTemplateColumns.split(' ').length;
    const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-columns,ArrowDown:columns}[event.key];tiles[Math.max(0,Math.min(tiles.length-1,index+delta))].focus();
  });
  }
  restore(window.openai?.widgetState);render();
  const fingerprint=()=>JSON.stringify([state.selected,state.preview,state.category,state.zoom,state.open]);
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot){const before=fingerprint();restore(snapshot);if(before!==fingerprint())render();}});
  if(globalThis.Tweak)for(const host of hosts){const tweak=new Tweak({container:host,onChange:()=>render()});tweak.addSlider(state,'width',{label:'Ширина панели',min:320,max:440,step:20,unit:'px'});}
})();
</script>
